[package]
name = "pingex-app"
version = "0.1.0"
description = "An independent macOS desktop frontend for the Codex CLI"
authors = ["Ciaran Kelly"]
edition = "2021"

[lib]
name = "pingex_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
ignore = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "time"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = "0.22"
turso = { version = "0.7", default-features = false }

[dev-dependencies]
tempfile = "3"
