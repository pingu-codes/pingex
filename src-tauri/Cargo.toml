[package]
name = "pingex-app"
version = "0.1.0"
description = "An independent macOS desktop frontend for the Codex CLI"
authors = ["Ciaran Kelly"]
edition = "2021"

[lib]
name = "pingex_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
ignore = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "time"] }
# CDP to the user's own Chrome: plain ws:// on 127.0.0.1 only, so no TLS.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = "0.22"
turso = { version = "0.7", default-features = false }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
# Checks the browser helper's extension id against its manifest key.
sha2 = "0.10"

# Faster edit/test cycles: skip full debuginfo and keep it out of the link step.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
